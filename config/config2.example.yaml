models:
 "<model_name>": # model: "gpt-4-turbo"  # or gpt-3.5-turbo
   api_type: "openai"  # or azure / ollama / groq etc.
   base_url: "<your base url>" 
   api_key: "<your api key>"
   temperature: 0
 "<model_name>":  
   api_type: "openai"  
   base_url: "<your base url>"
   api_key: "<your api key>"
   temperature: 0

experience_memory:
  enabled: true
  store_path: "workspace/MATH/workflows/experience_store"
  min_support: 3
  min_confidence: 0.6
  compression_interval: 10

attribution:
  enabled: true
  mode: "heuristic"
  taxonomy:
    - planning_error
    - reasoning_error
    - verification_missing
    - weak_revision
    - tool_error
    - premature_stop
    - evidence_missing
    - over_complexity
    - regression
    - unknown

adaptive_validation:
  enabled: true
  targeted_failure_size: 8
  success_guard_size: 8
  anchor_size: 16
  full_validation_top_k: 3
  beta: 0.5
  gamma: 0.5
  lambda_cost: 0.1

task_embedding:
  enabled: true
  model_name: "Qwen/Qwen3-Embedding-0.6B"
  base_url: "http://localhost:8090/v1"
  api_key: "EMPTY"
  dim: 64
  similarity_threshold: 0.55

experience_guided_refactor:
  enable_prompt_budget_diagnostics: true
  use_failure_cards: true
  use_optimization_state_memory_query: true
  use_memory_guided_parent_selection: true
  use_memory_guided_patch_scope: true
  use_memory_as_experience_replacement: true
  use_graph_prompt_summarization: true
